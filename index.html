 if(mode){moveMe(dt);if(mode==1)hostTick(dt);acc+=dt;if(acc>=.05){acc=0;if(mode==1)snap();else if(hc&&hc.open){const p=P[me];if(p)hc.send({t:'p',x:p.x,f:p.f,sn:p.sn,d:p.d})}}
  const a=Math.min(1,dt*14);for(const id in P){const p=P[id];p.rx=id==me?p.x:p.rx+(p.x-p.rx)*a;p.rf+=(p.f-p.rf)*Math.min(1,dt*12)}
  G.gd.forEach(g=>g.rx+=(g.x-g.rx)*a);
  if(G.sc>lsc)beep(880,.08);lsc=G.sc;if(G.st!=lst){if(G.st=='caught')beep(160,.5);if(G.st=='win')beep(1200,.3);lst=G.st}}
 draw();ui();
 $('hud').textContent=mode?`${L.n}  ·  💰 ${G.sc}/${L.need}  ·  👥 ${Object.keys(P).length}  ·  تلاش ${G.tries+1}`:'';
 $('msg').textContent=G.st=='caught'?'🚨 گرفتار شدید!':G.st=='win'?'✅ عالی بود!':'';
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
