name: Build Harbor GLB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Blender 4.2 LTS
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_VERSION="4.2.23"
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          URL="https://download.blender.org/release/Blender4.2/${ARCHIVE}"

          sudo apt-get update
          sudo apt-get install -y \
            curl xz-utils libx11-6 libxi6 libxrender1 libxfixes3 \
            libxext6 libxxf86vm1 libxkbcommon0 libsm6 libgl1 libegl1 \
            libdbus-1-3 libfontconfig1

          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/$ARCHIVE" \
            --strip-components=1 -C "$RUNNER_TEMP/blender"

          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python-expr "import bpy; print('BLENDER_VERSION=' + bpy.app.version_string)"

      - name: Generate environment.glb
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          blender --background --python harbor_voxel.py -- "$GITHUB_WORKSPACE/output"

      - name: Validate GLB output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import struct

          path = pathlib.Path("output/environment.glb")
          if not path.is_file() or path.stat().st_size < 20:
              raise SystemExit("ERROR: output/environment.glb is missing or empty")

          data = path.read_bytes()
          magic, version, total_length = struct.unpack_from("<4sII", data, 0)
          if magic != b"glTF":
              raise SystemExit("ERROR: Invalid GLB magic header")
          if version != 2:
              raise SystemExit(f"ERROR: Expected GLB version 2, got {version}")
          if total_length != len(data):
              raise SystemExit("ERROR: GLB declared length does not match file size")

          json_length, json_type = struct.unpack_from("<I4s", data, 12)
          if json_type != b"JSON":
              raise SystemExit("ERROR: First GLB chunk is not JSON")
          document = json.loads(data[20:20 + json_length].decode("utf-8").rstrip("\x00 \t\r\n"))
          meshes = document.get("meshes", [])
          materials = document.get("materials", [])
          if not meshes:
              raise SystemExit("ERROR: GLB contains no meshes")
          print(f"VALID GLB: {path.stat().st_size:,} bytes")
          print(f"Meshes: {len(meshes)} | Materials: {len(materials)}")
          PY

      - name: Upload generated GLB
        uses: actions/upload-artifact@v4
        with:
          name: harbor-environment-glb
          path: output/environment.glb
          if-no-files-found: error
          retention-days: 14
