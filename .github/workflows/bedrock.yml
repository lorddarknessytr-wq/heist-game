name: Bedrock 1.20.30.02 - Playit Direct UDP

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: bedrock-solo-test
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      WORLD_BACKUP_PASSWORD: ${{ secrets.WORLD_BACKUP_PASSWORD }}
      PLAYIT_PUBLIC_HOST: molecule-porter.tun.ply.gg
      PLAYIT_PUBLIC_PORT: '5536'
      PLAYIT_PUBLIC_IP: 147.185.221.216

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools and validate Playit secret
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip curl openssl
          if [[ -z "$PLAYIT_SECRET" ]]; then
            echo "ERROR: Add PLAYIT_SECRET under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "PLAYIT_SECRET is present. Secret values are not printed."
          if [[ -z "$WORLD_BACKUP_PASSWORD" ]]; then
            echo "WORLD_BACKUP_PASSWORD is absent: encrypted world backup/restore is disabled."
          else
            echo "Encrypted world backup/restore is enabled."
          fi

      - name: Download Bedrock Dedicated Server 1.20.30.02
        run: |
          set -euo pipefail
          mkdir -p server
          VERSION="1.20.30.02"
          ARCHIVE="/tmp/bedrock-server-${VERSION}.zip"
          URL="https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-${VERSION}.zip"
          USER_AGENT="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36"

          rm -f "$ARCHIVE"
          curl --http1.1 \
            --fail --location --show-error \
            --user-agent "$USER_AGENT" \
            --header 'Accept: */*' \
            --referer 'https://www.minecraft.net/' \
            --retry 4 --retry-all-errors --retry-delay 4 \
            --connect-timeout 20 --max-time 1200 \
            --output "$ARCHIVE" "$URL"

          if ! unzip -tq "$ARCHIVE" >/dev/null; then
            echo "ERROR: Downloaded file is not a valid Bedrock server ZIP archive."
            exit 1
          fi
          unzip -q "$ARCHIVE" -d server
          test -f server/bedrock_server || { echo "ERROR: bedrock_server not found in archive."; exit 1; }
          cp config/server.properties server/server.properties
          chmod +x server/bedrock_server

          # This workflow uses the regular Bedrock UDP tunnel (RakNet),
          # forwarding Playit to the local BDS listener on UDP 19132.
          sed -i 's/^server-port=.*/server-port=19132/' server/server.properties
          sed -i 's/^server-portv6=.*/server-portv6=19133/' server/server.properties

      - name: Restore latest saved world (optional)
        if: ${{ env.WORLD_BACKUP_PASSWORD != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p restore server
          mapfile -t run_ids < <(gh run list --workflow bedrock.yml --limit 20 --json databaseId --jq '.[].databaseId')
          restored=false
          for run_id in "${run_ids[@]}"; do
            rm -rf restore/*
            if gh run download "$run_id" --name bedrock-world --dir restore >/dev/null 2>&1 \
              && [ -f restore/world.tar.gz.enc ]; then
              if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
                -in restore/world.tar.gz.enc \
                -out restore/world.tar.gz \
                -pass env:WORLD_BACKUP_PASSWORD 2>/dev/null \
                && tar -tzf restore/world.tar.gz >/dev/null 2>&1; then
                tar -xzf restore/world.tar.gz -C server
                restored=true
                echo "Restored the previous world backup."
                break
              fi
              echo "Could not decrypt/validate backup from run ${run_id}; checking an older run."
            fi
          done
          if [ "$restored" = false ]; then
            echo "No usable earlier backup found; BDS will generate a new flat world."
          fi

      - name: Start Playit agent
        run: |
          set -euo pipefail
          docker rm --force bedrock-playit >/dev/null 2>&1 || true
          docker run --detach \
            --name bedrock-playit \
            --restart=no \
            --network host \
            --env SECRET_KEY="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          sleep 15
          agent_log="$(docker logs --tail 100 bedrock-playit 2>&1 || true)"
          if grep -q 'email_not_verified' <<<"$agent_log"; then
            echo "ERROR: Verify the email address on your Playit account, then run this workflow again."
            exit 1
          fi
          if ! grep -q 'playit connected' <<<"$agent_log"; then
            echo "ERROR: Playit agent has not reported a connection. Recent agent log:"
            printf '%s\n' "$agent_log" | tail -n 35
            exit 1
          fi
          tunnel_count="$(grep -oE 'tunnel_count=[0-9]+' <<<"$agent_log" | tail -n 1 | cut -d= -f2 || true)"
          if [[ -n "$tunnel_count" && "$tunnel_count" == "0" ]]; then
            echo "ERROR: Playit agent is connected, but no tunnel is assigned to this agent. Check the tunnel's Agent selection in Playit."
            printf '%s\n' "$agent_log" | tail -n 35
            exit 1
          fi
          echo "Playit agent is connected. Secret values are not printed."

      - name: Run Bedrock server (maximum 5 hours 30 minutes)
        run: |
          set -euo pipefail
          {
            echo "## Minecraft Bedrock connection"
            echo "- Server address: **${PLAYIT_PUBLIC_HOST}**"
            echo "- Port: **${PLAYIT_PUBLIC_PORT}/UDP**"
            echo "- Alternative IP: **${PLAYIT_PUBLIC_IP}:${PLAYIT_PUBLIC_PORT}**"
            echo "- Playit local target must be **127.0.0.1:19132/UDP**."
            echo "- Use a regular **Minecraft Bedrock** or UDP tunnel, not **Minecraft Bedrock (NetherNet)** for this direct RakNet setup."
            echo "- Session limit: **5 hours 30 minutes**."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Starting Bedrock Dedicated Server 1.20.30.02..."
          echo "Public endpoint: ${PLAYIT_PUBLIC_HOST}:${PLAYIT_PUBLIC_PORT}"
          echo "Playit local target: 127.0.0.1:19132/UDP"

          set +e
          cd server
          timeout --signal=INT --kill-after=30s 330m \
            env LD_LIBRARY_PATH=. ./bedrock_server > ../server.log 2>&1
          server_code=$?
          cd ..
          set -e
          printf '%s\n' "$server_code" > server-exit-code.txt
          if [[ "$server_code" -eq 124 || "$server_code" -eq 130 ]]; then
            echo "The planned server session ended."
          elif [[ "$server_code" -eq 0 ]]; then
            echo "The server stopped normally."
          else
            echo "ERROR: Bedrock server exited unexpectedly (code ${server_code}). Its detailed log is not printed because this repository is public."
            exit 1
          fi

      - name: Stop Playit agent
        if: always()
        run: docker rm --force bedrock-playit >/dev/null 2>&1 || true

      - name: Encrypt world backup (optional)
        id: backup_world
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          if [[ -z "$WORLD_BACKUP_PASSWORD" ]]; then
            echo "No backup password: skipping backup to avoid publishing an unencrypted world."
            echo "created=false" >> "$GITHUB_OUTPUT"
          elif [ -d server/worlds/FlatTestWorld ]; then
            tar -czf out/world.tar.gz -C server worlds/FlatTestWorld
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in out/world.tar.gz \
              -out out/world.tar.gz.enc \
              -pass env:WORLD_BACKUP_PASSWORD
            rm -f out/world.tar.gz
            echo "Encrypted world backup created."
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "No world folder exists; no backup was created."
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload encrypted world backup
        if: always() && steps.backup_world.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bedrock-world
          path: out/world.tar.gz.enc
          if-no-files-found: error
          retention-days: 90
