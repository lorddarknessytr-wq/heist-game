name: Bedrock 1.20.30.02 - Solo Test

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: bedrock-solo-test
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check secrets and install tools
        env:
          MINECRAFT_GAMERTAG: ${{ secrets.MINECRAFT_GAMERTAG }}
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
          WORLD_BACKUP_PASSWORD: ${{ secrets.WORLD_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MINECRAFT_GAMERTAG" || { echo "Missing repository secret: MINECRAFT_GAMERTAG"; exit 1; }
          test -n "$PLAYIT_SECRET" || { echo "Missing repository secret: PLAYIT_SECRET"; exit 1; }
          test -n "$WORLD_BACKUP_PASSWORD" || { echo "Missing repository secret: WORLD_BACKUP_PASSWORD"; exit 1; }
          command -v docker >/dev/null
          command -v gh >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y unzip curl python3

      - name: Download Bedrock Dedicated Server 1.20.30.02
        run: |
          set -euo pipefail
          mkdir -p server
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://minecraft.azureedge.net/bin-linux/bedrock-server-1.20.30.02.zip" \
            --output /tmp/bedrock-server.zip
          unzip -q /tmp/bedrock-server.zip -d server
          cp config/server.properties server/server.properties
          chmod +x server/bedrock_server

      - name: Restore the latest saved world
        env:
          GH_TOKEN: ${{ github.token }}
          WORLD_BACKUP_PASSWORD: ${{ secrets.WORLD_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p restore server
          mapfile -t run_ids < <(gh run list --workflow bedrock.yml --limit 20 --json databaseId --jq '.[].databaseId')
          restored=false
          for run_id in "${run_ids[@]}"; do
            rm -rf restore/*
            if gh run download "$run_id" --name bedrock-world --dir restore >/dev/null 2>&1 \
              && [ -f restore/world.tar.gz.enc ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
                -in restore/world.tar.gz.enc \
                -out restore/world.tar.gz \
                -pass env:WORLD_BACKUP_PASSWORD
              tar -xzf restore/world.tar.gz -C server
              restored=true
              echo "Restored the previous world backup."
              break
            fi
          done
          if [ "$restored" = false ]; then
            echo "No earlier backup found; BDS will generate a new flat world."
          fi

      - name: Create the private allowlist
        env:
          MINECRAFT_GAMERTAG: ${{ secrets.MINECRAFT_GAMERTAG }}
        run: |
          set -euo pipefail
          python3 scripts/create_allowlist.py server/allowlist.json

      - name: Start Playit agent
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -euo pipefail
          docker run --detach \
            --name bedrock-playit \
            --restart=no \
            --network host \
            --env SECRET_KEY="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest
          sleep 8
          echo "Playit agent process started. Check the Playit dashboard for tunnel status and address."

      - name: Run Bedrock server (maximum 5 hours 30 minutes)
        id: run_bedrock
        run: |
          set +e
          cd server
          timeout --signal=INT --kill-after=30s 330m \
            env LD_LIBRARY_PATH=. ./bedrock_server > ../server.log 2>&1
          server_code=$?
          cd ..
          printf '%s\n' "$server_code" > server-exit-code.txt
          if [ "$server_code" -eq 124 ]; then
            echo "The planned server session ended."
          elif [ "$server_code" -eq 0 ]; then
            echo "The server stopped normally."
          else
            echo "The server process ended unexpectedly (exit code $server_code). Its detailed log is not published because this repository is public."
          fi
          exit 0

      - name: Stop Playit agent
        if: always()
        run: docker rm --force bedrock-playit >/dev/null 2>&1 || true

      - name: Encrypt world backup
        if: always()
        env:
          WORLD_BACKUP_PASSWORD: ${{ secrets.WORLD_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -d server/worlds/FlatTestWorld ]; then
            tar -czf out/world.tar.gz -C server worlds/FlatTestWorld
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in out/world.tar.gz \
              -out out/world.tar.gz.enc \
              -pass env:WORLD_BACKUP_PASSWORD
            rm -f out/world.tar.gz
            echo "Encrypted world backup created."
          else
            echo "No world folder exists; no backup was created."
          fi

      - name: Upload encrypted world backup
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bedrock-world
          path: out/world.tar.gz.enc
          if-no-files-found: warn
          retention-days: 90

      - name: Report unexpected server exit
        if: always()
        run: |
          set -euo pipefail
          if [ -f server-exit-code.txt ]; then
            server_code="$(cat server-exit-code.txt)"
            if [ "$server_code" -ne 0 ] && [ "$server_code" -ne 124 ]; then
              echo "BDS exited unexpectedly with code $server_code. The detailed server log was not published."
              exit 1
            fi
          fi
