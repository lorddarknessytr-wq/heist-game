name: Minecraft Java 1.8.9 - Playit TCP

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: minecraft-java-189-solo-test
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      WORLD_BACKUP_PASSWORD: ${{ secrets.WORLD_BACKUP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Validate settings and Playit secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PLAYIT_SECRET" ]]; then
            echo "ERROR: Add the existing PLAYIT_SECRET under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*eula=true[[:space:]]*$' eula.txt; then
            echo "ERROR: Read the Minecraft EULA, then change eula=false to eula=true in the repository's eula.txt and commit it."
            exit 1
          fi
          java -version
          echo "PLAYIT_SECRET is present. Secret values are not printed."
          if [[ -z "$WORLD_BACKUP_PASSWORD" ]]; then
            echo "WORLD_BACKUP_PASSWORD is absent: encrypted world backup/restore is disabled."
          else
            echo "Encrypted Java world backup/restore is enabled."
          fi

      - name: Download official Minecraft Java server 1.8.9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server

          SERVER_URL="https://launcher.mojang.com/mc/game/1.8.9/server/b58b2ceb36e01bcd8dbf49c8fb66c55a9f0676cd/server.jar"
          SERVER_SHA1="b58b2ceb36e01bcd8dbf49c8fb66c55a9f0676cd"
          SERVER_JAR="server/server.jar"

          curl --http1.1 --fail --location --show-error \
            --retry 4 --retry-all-errors --retry-delay 4 \
            --connect-timeout 20 --max-time 1200 \
            --output "$SERVER_JAR" "$SERVER_URL"
          echo "$SERVER_SHA1  $SERVER_JAR" | sha1sum --check --status || {
            echo "ERROR: The downloaded Minecraft 1.8.9 server JAR failed its SHA-1 check."
            exit 1
          }

          # Mojang's official Log4j mitigation for Minecraft versions 1.7–1.11.2.
          LOG4J_URL="https://launcher.mojang.com/v1/objects/4bb89a97a66f350bc9f73b3ca8509632682aea2e/log4j2_17-111.xml"
          LOG4J_SHA1="4bb89a97a66f350bc9f73b3ca8509632682aea2e"
          curl --http1.1 --fail --location --show-error \
            --retry 4 --retry-all-errors --retry-delay 4 \
            --connect-timeout 20 --max-time 120 \
            --output "server/log4j2_17-111.xml" "$LOG4J_URL"
          echo "$LOG4J_SHA1  server/log4j2_17-111.xml" | sha1sum --check --status || {
            echo "ERROR: Mojang's Log4j mitigation file failed its SHA-1 check."
            exit 1
          }

          cp config/server.properties server/server.properties
          cp eula.txt server/eula.txt
          test -s server/server.jar
          test -s server/log4j2_17-111.xml
          echo "Verified official Minecraft Java 1.8.9 server JAR and Mojang Log4j mitigation file."

      - name: Restore latest saved Java world (optional)
        if: ${{ env.WORLD_BACKUP_PASSWORD != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore server
          mapfile -t run_ids < <(gh run list --workflow bedrock.yml --limit 20 --json databaseId --jq '.[].databaseId')
          restored=false
          for run_id in "${run_ids[@]}"; do
            rm -rf restore/*
            if gh run download "$run_id" --name java189-world --dir restore >/dev/null 2>&1 \
              && [ -f restore/world.tar.gz.enc ]; then
              if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
                -in restore/world.tar.gz.enc \
                -out restore/world.tar.gz \
                -pass env:WORLD_BACKUP_PASSWORD 2>/dev/null \
                && tar -tzf restore/world.tar.gz >/dev/null 2>&1; then
                tar -xzf restore/world.tar.gz -C server
                restored=true
                echo "Restored the previous Java world backup."
                break
              fi
              echo "Could not decrypt/validate Java backup from run ${run_id}; checking an older run."
            fi
          done
          if [ "$restored" = false ]; then
            echo "No usable Java world backup found; a new flat world will be generated."
          fi

      - name: Start Playit agent
        shell: bash
        run: |
          set -euo pipefail
          docker rm --force minecraft-playit >/dev/null 2>&1 || true
          docker run --detach \
            --name minecraft-playit \
            --restart=no \
            --network host \
            --env SECRET_KEY="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          sleep 15
          agent_log="$(docker logs --tail 100 minecraft-playit 2>&1 || true)"
          if grep -q 'email_not_verified' <<<"$agent_log"; then
            echo "ERROR: Verify the email address on your Playit account, then run this workflow again."
            exit 1
          fi
          if ! grep -q 'playit connected' <<<"$agent_log"; then
            echo "ERROR: Playit agent has not reported a connection. Recent agent log:"
            printf '%s\n' "$agent_log" | tail -n 35
            exit 1
          fi
          # Match only the exact field; do not accidentally read pending/disabled counts.
          tunnel_count="$(awk '{for (i=1; i<=NF; i++) if ($i ~ /^tunnel_count=[0-9]+$/) {v=$i; sub(/^tunnel_count=/, "", v)}} END {if (v != "") print v}' <<<"$agent_log")"
          if [[ -z "$tunnel_count" ]]; then
            echo "WARNING: Playit connected, but tunnel_count was not present in the captured log. Check the Playit dashboard."
          elif [[ "$tunnel_count" == "0" ]]; then
            echo "ERROR: Playit is connected, but no tunnel is assigned to this agent. Assign the Minecraft Java tunnel to this agent."
            printf '%s\n' "$agent_log" | tail -n 35
            exit 1
          else
            echo "Playit agent is connected and reports ${tunnel_count} assigned tunnel(s)."
          fi
          echo "Secret values are not printed."

      - name: Run Minecraft Java server 1.8.9 (maximum 5 hours 30 minutes)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Minecraft Java Edition 1.8.9"
            echo "- Edition/version: **Java Edition 1.8.9**"
            echo "- Playit tunnel: **Minecraft Java (TCP)**"
            echo "- Local target: **127.0.0.1:25565/TCP**"
            echo "- Public hostname/port: **Use the current address displayed by the Playit dashboard**"
            echo "- World: **FlatTestWorld (flat)**"
            echo "- Max players: **1**"
            echo "- Session limit: **5 hours 30 minutes**"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Starting Minecraft Java server 1.8.9..."
          echo "Playit Java tunnel must target 127.0.0.1:25565/TCP."

          set +e
          cd server
          timeout --signal=INT --kill-after=30s 330m \
            java -Xms512M -Xmx2G \
              -Dlog4j.configurationFile=log4j2_17-111.xml \
              -jar server.jar nogui > ../server.log 2>&1
          server_code=$?
          cd ..
          set -e
          printf '%s\n' "$server_code" > server-exit-code.txt
          if [[ "$server_code" -eq 124 || "$server_code" -eq 130 ]]; then
            echo "The planned Java server session ended."
          elif [[ "$server_code" -eq 0 ]]; then
            echo "The Java server stopped normally."
          else
            echo "ERROR: Minecraft Java server exited unexpectedly (code ${server_code}). Detailed logs are not published because this repository is public."
            exit 1
          fi

      - name: Stop Playit agent
        if: always()
        run: docker rm --force minecraft-playit >/dev/null 2>&1 || true

      - name: Encrypt Java world backup (optional)
        id: backup_world
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [[ -z "$WORLD_BACKUP_PASSWORD" ]]; then
            echo "No backup password: skipping backup to avoid publishing an unencrypted world."
            echo "created=false" >> "$GITHUB_OUTPUT"
          elif [ -d server/FlatTestWorld ]; then
            tar -czf out/world.tar.gz -C server FlatTestWorld
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in out/world.tar.gz \
              -out out/world.tar.gz.enc \
              -pass env:WORLD_BACKUP_PASSWORD
            rm -f out/world.tar.gz
            echo "Encrypted Java world backup created."
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Java world folder exists; no backup was created."
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload encrypted Java world backup
        if: always() && steps.backup_world.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: java189-world
          path: out/world.tar.gz.enc
          if-no-files-found: error
          retention-days: 90
