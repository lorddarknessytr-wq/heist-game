name: Build Lobby GLB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xz-utils wget \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libglu1-mesa libsm6 libice6 libxkbcommon0

      - name: Download Blender 4.2 LTS
        run: |
          BLENDER_VERSION=4.2.3
          wget -q "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf "blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          sudo mv "blender-${BLENDER_VERSION}-linux-x64" /opt/blender
          echo "/opt/blender" >> "$GITHUB_PATH"

      - name: Verify Blender
        run: blender --version

      - name: Build lobby.glb
        run: |
          blender -b --factory-startup --python tools/build_lobby.py -- --out out/lobby.glb

      - name: Validate GLB
        run: python3 tools/validate_glb.py out/lobby.glb

      - name: Upload GLB + meta as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lobby-glb
          path: |
            out/lobby.glb
            out/lobby.meta.json
          if-no-files-found: error
          retention-days: 30
