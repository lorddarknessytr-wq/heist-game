name: Build procedural lobby GLB

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_lobby.py"
      - ".github/workflows/build-lobby-glb.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Generate lobby.glb
        run: |
          set -euxo pipefail
          echo "Repository: $PWD"
          test -f scripts/generate_lobby.py
          mkdir -p build
          blender --background --factory-startup --python scripts/generate_lobby.py -- --output "$PWD/build/lobby.glb"
          # Blender can occasionally print a Python traceback while its process
          # still returns success; check the artifact immediately in this step.
          test -s build/lobby.glb
          echo "Files produced in build/:"
          ls -lah build/

      - name: Verify output
        run: |
          set -euxo pipefail
          test -f build/lobby.glb
          test -s build/lobby.glb
          ls -lh build/lobby.glb

      - name: Upload GLB artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-harbor-lobby-glb
          path: build/lobby.glb
          if-no-files-found: error
          retention-days: 14
