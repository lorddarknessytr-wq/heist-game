name: Watch Aparat Short Video (Logged In)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیوی کوتاه آپارات (مثال: https://www.aparat.com/v/xxxxx)'
        required: true
        type: string

jobs:
  watch_video:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # کمی بیشتر در نظر گرفتیم تا در صورت کندی اینترنت گیت‌هاب، تایم‌اوت نشود
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Create storage state from secret
        run: |
          # این مرحله فایل aparat-state.json را از سکرتی که ساختید بازسازی می‌کند
          echo "${{ secrets.APARAT_STORAGE_STATE_B64 }}" | base64 -d > aparat-state.json

      - name: Open Aparat video and wait until ended
        run: |
          cat > watch-video.js << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const videoUrl = process.env.VIDEO_URL;
            console.log(`Opening with authenticated session: ${videoUrl}`);

            // اجرای مرورگر در پس‌زمینه (بدون رابط کاربری)
            const browser = await chromium.launch({ headless: true });

            // *** نکته کلیدی: استفاده از فایل وضعیت لاگین ***
            const context = await browser.newContext({
              storageState: 'aparat-state.json'
            });
            const page = await context.newPage();

            // رفتن به لینک ویدیو
            console.log('Navigating to the page...');
            await page.goto(videoUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
            
            // کمی صبر می‌کنیم تا پلیر و اسکریپت‌های آپارات لود شوند
            await page.waitForTimeout(3000);

            console.log('Looking for <video> element...');
            // منتظر می‌مانیم تا تگ ویدیو در صفحه ظاهر شود
            const video = await page.waitForSelector('video', { timeout: 30000 });
            console.log('Video element found.');

            // استخراج عنوان ویدیو برای اینکه در لاگ ببینید ویدیو درست باز شده
            const title = await page.title();
            console.log(`Video Title: ${title}`);

            // اگر ویدیو به صورت خودکار پخش نشد، دکمه پخش را شبیه‌سازی می‌کنیم
            await page.evaluate(() => {
              const v = document.querySelector('video');
              if (v && v.paused) {
                v.play().catch(e => console.log('Autoplay blocked by browser:', e.message));
              }
            });

            console.log('Waiting for video to finish (this might take a while)...');

            // *** مهم‌ترین بخش: منتظر رویداد `ended` می‌مانیم ***
            await page.evaluate(() => {
              return new Promise((resolve) => {
                const v = document.querySelector('video');
                if (v.ended) {
                  resolve(); // اگر از قبل تموم شده بود
                } else {
                  v.addEventListener('ended', () => resolve(), { once: true });
                }
              });
            });

            console.log('✅ Video finished successfully. Closing browser.');
            await browser.close();
          })();
          EOF
          node watch-video.js
        env:
          VIDEO_URL: ${{ inputs.video_url }}
