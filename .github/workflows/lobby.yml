name: Remaster Shipment Lobby
on:
  workflow_dispatch:
  push:
    paths: ['tools/remaster_shipment.py', '.github/workflows/remaster.yml']
permissions:
  contents: write
jobs:
  remaster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install "trimesh>=4.0" pillow numpy
      - run: python tools/remaster_shipment.py --out assets/lobby.glb
      - name: Commit remastered GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lobby.glb
          git diff --cached --quiet || git commit -m "remaster: assets/lobby.glb [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with: { name: lobby-remaster, path: assets/lobby.glb }
